name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Os testes usam src/ (dados, recomendação, estatística) e o app Streamlit com o modelo salvo em Model/
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
